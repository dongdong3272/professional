<!-- start custom head snippets -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
  rel="stylesheet"
/>

<!-- insert favicons. use https://realfavicongenerator.net/ -->
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="{{ '/favicon/apple-touch-icon.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="{{ '/favicon/favicon-32x32.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="{{ '/favicon/favicon-16x16.png' | relative_url }}"
/>
<link rel="manifest" href="{{ '/favicon/site.webmanifest' | relative_url }}" />
<link
  rel="mask-icon"
  href="{{ '/favicon/safari-pinned-tab.svg' | relative_url }}"
  color="#0f766e"
/>
<meta name="msapplication-TileColor" content="#0f766e" />
<meta name="theme-color" content="#ffffff" />

<style>
  :root {
    --brand-teal: #0f766e;
    --brand-charcoal: #1e293b;
    --brand-muted: #64748b;
    --brand-border: #e2e8f0;
    --font-sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    --font-mono: "Source Code Pro", Consolas, Monaco, monospace;
  }

  body,
  .page__content,
  .archive,
  .masthead,
  .sidebar,
  .page__footer {
    font-family: var(--font-sans);
    color: var(--brand-charcoal);
  }

  .page__content,
  .archive {
    font-size: 1rem;
    line-height: 1.65;
  }

  .page__title {
    font-family: var(--font-sans);
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.25;
  }

  .page__content h2,
  .page__content h3,
  .page__content h4,
  .archive h2,
  .archive h3,
  .archive h4 {
    font-family: var(--font-sans);
    font-weight: 600;
    color: var(--brand-charcoal);
  }

  .page__content h2 {
    font-size: 1.25rem;
  }

  .page__content h3 {
    font-size: 1.125rem;
  }

  .page__content em,
  .archive em {
    font-family: var(--font-sans);
    font-style: italic;
  }

  .archive__subtitle {
    margin-top: 2.25rem;
    margin-bottom: 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--brand-border);
    color: var(--brand-charcoal);
    font-family: var(--font-sans);
  }

  a {
    color: var(--brand-teal);
  }

  a:hover {
    color: #0d5f59;
  }

  .skills-list strong {
    color: var(--brand-charcoal);
    font-weight: 600;
  }

  .skills-list__values {
    color: var(--brand-muted);
  }

  /* Inline + block code — Feishu-doc quiet style */
  code {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
  }

  .page__content :not(pre) > code {
    background: #f1f5f9;
    border: 1px solid var(--brand-border);
    border-radius: 0.25rem;
    padding: 0.1em 0.35em;
    color: var(--brand-charcoal);
  }

  div.highlighter-rouge,
  figure.highlight,
  .page__content pre {
    max-width: 100%;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
  }

  .pagination-wrapper {
    margin-top: 2rem;
    margin-bottom: 2rem;
    text-align: center;
  }

  .pagination-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--brand-charcoal);
    margin-bottom: 1rem;
    text-align: center;
  }

  .pagination {
    display: flex;
    justify-content: center;
    margin-top: 1rem;
  }

  .pagination ul {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .pagination li a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    height: 2.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1;
    text-decoration: none;
    color: var(--brand-muted);
    background-color: #fff;
    border: 1px solid var(--brand-border);
    border-radius: 0.375rem;
    transition: border-color 0.15s ease, color 0.15s ease,
      background-color 0.15s ease;
  }

  .pagination li a:hover {
    color: var(--brand-charcoal);
    background-color: #f8fafc;
    border-color: #94a3b8;
  }

  .pagination li a.current {
    color: #fff;
    background-color: var(--brand-teal);
    border-color: var(--brand-teal);
  }

  .pagination li a.disabled {
    color: #cbd5e1;
    background-color: #f8fafc;
    border-color: var(--brand-border);
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Shared quiet card style: homepage posts + related */
  .entries-list,
  .page__related .grid__wrapper {
    margin-top: 1rem;
    margin-bottom: 2rem;
    display: grid;
    gap: 0.75rem;
  }

  .page__related .grid__wrapper {
    grid-template-columns: 1fr;
  }

  .entries-list .archive__item,
  .page__related .grid__item .archive__item {
    background: #ffffff;
    border: 1px solid var(--brand-border);
    border-radius: 0.375rem;
    padding: 1.15rem 1.25rem;
    margin-bottom: 0;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    box-shadow: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .page__related .grid__item {
    float: none;
    width: 100%;
    margin: 0;
  }

  .entries-list .archive__item > *:first-child,
  .page__related .grid__item .archive__item > *:first-child {
    margin-top: 0 !important;
    padding-top: 0 !important;
  }

  .entries-list .archive__item h1,
  .entries-list .archive__item h2,
  .entries-list .archive__item h3,
  .entries-list .archive__item h4,
  .entries-list .archive__item h5,
  .entries-list .archive__item h6,
  .page__related .archive__item h1,
  .page__related .archive__item h2,
  .page__related .archive__item h3,
  .page__related .archive__item h4,
  .page__related .archive__item h5,
  .page__related .archive__item h6 {
    margin-top: 0 !important;
    padding-top: 0 !important;
  }

  .entries-list .archive__item:hover,
  .page__related .grid__item .archive__item:hover {
    transform: none;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    border-color: var(--brand-teal);
  }

  .entries-list .archive__item::before,
  .page__related .grid__item .archive__item::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 2px;
    background: var(--brand-teal);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.15s ease;
  }

  .entries-list .archive__item:hover::before,
  .page__related .grid__item .archive__item:hover::before {
    transform: scaleY(1);
  }

  .entries-list .archive__item-title,
  .page__related .archive__item-title {
    font-size: 0.95rem;
    margin-top: 0;
    margin-bottom: 0.5rem;
    padding-top: 0;
    line-height: 1.3;
    font-weight: 600;
    color: var(--brand-charcoal);
    font-family: var(--font-sans);
  }

  .entries-list .archive__item-title a,
  .page__related .archive__item-title a {
    text-decoration: none;
    color: inherit;
    transition: color 0.15s ease;
  }

  .entries-list .archive__item:hover .archive__item-title a,
  .page__related .grid__item .archive__item:hover .archive__item-title a {
    color: var(--brand-teal);
  }

  .entries-list .archive__item-excerpt,
  .page__related .archive__item-excerpt {
    font-size: 0.8rem;
    color: var(--brand-muted);
    margin-bottom: 0.75rem;
    line-height: 1.4;
    font-family: var(--font-sans);
  }

  .entries-list .page__meta,
  .page__related .page__meta {
    font-size: 0.75rem;
    margin-bottom: 0;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .page__related-title {
    font-family: var(--font-sans);
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--brand-charcoal);
  }

  /* Posts: no author rail — wide centered reading column (~70vw).
     Scoped to wide single pages without .sidebar so Work/Research keep the profile rail. */
  body.layout--single.wide:not(:has(.sidebar)) #main {
    display: block;
  }

  body.layout--single.wide:not(:has(.sidebar)) .page,
  body.layout--single.wide:not(:has(.sidebar)) .page__related {
    float: none;
    width: 100%;
    max-width: min(52rem, 70vw);
    margin-left: auto;
    margin-right: auto;
    padding-right: 0;
  }

  body.layout--single.wide:not(:has(.sidebar)) .page__inner-wrap,
  body.layout--single.wide:not(:has(.sidebar)) .page__content {
    width: 100%;
  }

  @media (max-width: 768px) {
    body.layout--single.wide:not(:has(.sidebar)) .page,
    body.layout--single.wide:not(:has(.sidebar)) .page__related {
      max-width: 100%;
      padding-left: 0;
      padding-right: 0;
    }

    /* --- Mobile reading layout (phones / small tablets; desktop unchanged) --- */
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #main {
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .masthead__inner-wrap {
      padding-left: 0.85rem;
      padding-right: 0.85rem;
    }

    .greedy-nav a.site-title {
      font-size: 0.95rem;
      max-width: min(52vw, 12.5rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page__content,
    .archive {
      font-size: 1.0625rem;
      line-height: 1.7;
    }

    .page__title {
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .page__content h2,
    .archive h2 {
      font-size: 1.25rem;
    }

    .page__content h3,
    .archive h3 {
      font-size: 1.125rem;
    }

    .page__content h4,
    .archive h4 {
      font-size: 1.05rem;
    }

    .archive__subtitle {
      font-size: 1rem;
    }

    /* Author rail: MM defaults are ~10–12px; bump for touch reading */
    .sidebar p,
    .sidebar li {
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    .sidebar .author__name {
      font-size: 1.125rem;
      line-height: 1.3;
    }

    .author__bio {
      line-height: 1.45;
      margin-top: 0.35rem;
    }

    .author__avatar {
      width: 3.5rem;
      height: 3.5rem;
    }

    .author__avatar img {
      max-width: 3.5rem;
    }

    .author__content {
      padding-right: 0.75rem;
    }

    .author__urls-wrapper button {
      font-size: 0.875rem;
      min-height: 2.5rem;
      padding: 0.45rem 0.85rem;
    }

    /* Post / related cards */
    .entries-list .archive__item,
    .page__related .grid__item .archive__item {
      padding: 1rem 1.05rem;
    }

    .entries-list .archive__item-title,
    .page__related .archive__item-title {
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .entries-list .archive__item-excerpt,
    .page__related .archive__item-excerpt {
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    .entries-list .page__meta,
    .page__related .page__meta {
      font-size: 0.8125rem;
    }

    /* Code: readable size, scroll inside the block */
    code {
      font-size: 0.875rem;
    }

    div.highlighter-rouge,
    figure.highlight,
    .page__content pre {
      font-size: 0.8125rem;
      line-height: 1.55;
      -webkit-overflow-scrolling: touch;
    }

    .page__footer {
      font-size: 0.875rem;
    }

    .page__footer-follow .social-icons a,
    .page__footer-follow li {
      font-size: 0.875rem;
    }

    .pagination li a {
      min-width: 2.75rem;
      height: 2.75rem;
      font-size: 0.9375rem;
    }
  }
</style>

<!-- end custom head snippets -->
