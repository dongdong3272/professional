<!-- start custom head snippets -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
  rel="stylesheet"
/>

<!-- insert favicons. use https://realfavicongenerator.net/ -->
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="{{ '/favicon/apple-touch-icon.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="{{ '/favicon/favicon-32x32.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="{{ '/favicon/favicon-16x16.png' | relative_url }}"
/>
<link rel="manifest" href="{{ '/favicon/site.webmanifest' | relative_url }}" />
<link
  rel="mask-icon"
  href="{{ '/favicon/safari-pinned-tab.svg' | relative_url }}"
  color="#0f766e"
/>
<meta name="msapplication-TileColor" content="#0f766e" />
<meta name="theme-color" content="#ffffff" />

<style>
  :root {
    --brand-teal: #0f766e;
    --brand-charcoal: #1e293b;
    --brand-muted: #64748b;
    --brand-border: #e2e8f0;
    --font-sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    --font-mono: "Source Code Pro", Consolas, Monaco, monospace;
  }

  body,
  .page__content,
  .archive,
  .masthead,
  .sidebar,
  .page__footer {
    font-family: var(--font-sans);
    color: var(--brand-charcoal);
  }

  .page__content,
  .archive {
    font-size: 1rem;
    line-height: 1.65;
  }

  .page__title {
    font-family: var(--font-sans);
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.25;
  }

  .page__content h2,
  .page__content h3,
  .page__content h4,
  .archive h2,
  .archive h3,
  .archive h4 {
    font-family: var(--font-sans);
    font-weight: 600;
    color: var(--brand-charcoal);
  }

  .page__content h2 {
    font-size: 1.25rem;
  }

  .page__content h3 {
    font-size: 1.125rem;
  }

  .page__content em,
  .archive em {
    font-family: var(--font-sans);
    font-style: italic;
  }

  .archive__subtitle {
    margin-top: 2.25rem;
    margin-bottom: 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--brand-border);
    color: var(--brand-charcoal);
    font-family: var(--font-sans);
  }

  a {
    color: var(--brand-teal);
  }

  a:hover {
    color: #0d5f59;
  }

  .skills-list strong {
    color: var(--brand-charcoal);
    font-weight: 600;
  }

  .skills-list__values {
    color: var(--brand-muted);
  }

  /* Inline + block code — Feishu-doc quiet style */
  code {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
  }

  .page__content :not(pre) > code {
    background: #f1f5f9;
    border: 1px solid var(--brand-border);
    border-radius: 0.25rem;
    padding: 0.1em 0.35em;
    color: var(--brand-charcoal);
  }

  div.highlighter-rouge,
  figure.highlight,
  .page__content pre {
    max-width: 100%;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
  }

  .pagination-wrapper {
    margin-top: 2rem;
    margin-bottom: 2rem;
    text-align: center;
  }

  .pagination-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--brand-charcoal);
    margin-bottom: 1rem;
    text-align: center;
  }

  .pagination {
    display: flex;
    justify-content: center;
    margin-top: 1rem;
  }

  .pagination ul {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .pagination li a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    height: 2.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1;
    text-decoration: none;
    color: var(--brand-muted);
    background-color: #fff;
    border: 1px solid var(--brand-border);
    border-radius: 0.375rem;
    transition: border-color 0.15s ease, color 0.15s ease,
      background-color 0.15s ease;
  }

  .pagination li a:hover {
    color: var(--brand-charcoal);
    background-color: #f8fafc;
    border-color: #94a3b8;
  }

  .pagination li a.current {
    color: #fff;
    background-color: var(--brand-teal);
    border-color: var(--brand-teal);
  }

  .pagination li a.disabled {
    color: #cbd5e1;
    background-color: #f8fafc;
    border-color: var(--brand-border);
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Compact post cards: title + date, clearly clickable */
  .entries-list--compact {
    margin-top: 0.5rem;
    margin-bottom: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }

  .compact__item {
    width: 100%;
  }

  .entries-list--compact .archive__item--compact,
  .entries-list--compact .archive__item {
    background: #fff !important;
    border: 1px solid var(--brand-border) !important;
    border-radius: 0.5rem !important;
    padding: 0.75rem 1rem !important;
    margin: 0 !important;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease,
      transform 0.15s ease;
  }

  .entries-list--compact .archive__item:hover {
    border-color: #99f6e4 !important;
    box-shadow: 0 4px 14px rgba(15, 118, 110, 0.1);
    transform: translateY(-1px);
  }

  .entries-list--compact .archive__item::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 3px;
    background: var(--brand-teal);
    transform: scaleY(0);
    transform-origin: center;
    transition: transform 0.15s ease;
  }

  .entries-list--compact .archive__item:hover::before {
    transform: scaleY(1);
  }

  .archive__item-compact-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .entries-list--compact .archive__item-title {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.9375rem !important;
    font-weight: 600;
    line-height: 1.4;
    margin: 0 !important;
    padding: 0 !important;
    color: var(--brand-charcoal) !important;
    font-family: var(--font-sans);
  }

  .entries-list--compact .archive__item-title a,
  .entries-list--compact .archive__item-title a:link,
  .entries-list--compact .archive__item-title a:visited,
  .entries-list--compact .archive__item-title a:active {
    text-decoration: none !important;
    color: var(--brand-charcoal) !important;
    transition: color 0.15s ease;
  }

  .entries-list--compact .archive__item-title a:hover,
  .entries-list--compact .archive__item:hover .archive__item-title a,
  .entries-list--compact .archive__item:hover .archive__item-title a:visited {
    color: var(--brand-teal) !important;
  }

  .entries-list--compact .archive__item-date {
    flex: 0 0 auto;
    font-size: 0.8125rem;
    font-weight: 500;
    color: #94a3b8;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .entries-list--compact .page__meta,
  .entries-list--compact .archive__item-excerpt {
    display: none !important;
  }

  .recent-posts__more {
    margin: 0.65rem 0 0;
    font-size: 0.875rem;
  }

  .recent-posts__more a,
  .recent-posts__more a:link,
  .recent-posts__more a:visited {
    text-decoration: none;
    font-weight: 600;
    color: var(--brand-teal) !important;
  }

  .recent-posts__more a:hover {
    text-decoration: underline;
  }

  .page__related {
    margin-top: 2.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--brand-border);
  }

  .page__related-title {
    font-family: var(--font-sans);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--brand-muted);
    margin-bottom: 0.65rem;
  }

  /* Posts archive: year groups + compact clickable cards */
  .posts-year-index {
    margin: 0 0 1.25rem !important;
    padding: 0 !important;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.25rem;
  }

  .posts-year-index li {
    margin: 0 !important;
  }

  .posts-year-index a,
  .posts-year-index a:link,
  .posts-year-index a:visited {
    text-decoration: none;
    color: var(--brand-muted) !important;
    font-size: 0.875rem;
  }

  .posts-year-index a:hover {
    color: var(--brand-teal) !important;
  }

  .posts-year-index .taxonomy__count {
    color: #94a3b8;
    font-weight: 400;
  }

  .posts-year-section.taxonomy__section {
    margin-top: 0.75rem !important;
    margin-bottom: 1.25rem !important;
    padding-bottom: 0 !important;
    border-bottom: none !important;
  }

  .posts-year-section + .posts-year-section {
    margin-top: 1.5rem !important;
  }

  .posts-year-index.taxonomy__index {
    display: flex !important;
    grid-template-columns: none !important;
    margin: 0 0 1rem !important;
  }

  .posts-year-index.taxonomy__index a {
    display: inline;
    padding: 0;
    border-bottom: none;
  }

  .posts-year-heading {
    margin-top: 0 !important;
    margin-bottom: 0.65rem !important;
    padding-bottom: 0.35rem !important;
    font-size: 1rem !important;
    font-weight: 700 !important;
    color: var(--brand-charcoal) !important;
    border-bottom: 1px solid var(--brand-border) !important;
  }

  .posts-title-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .posts-title-list__item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin: 0;
    padding: 0.75rem 1rem;
    background: #fff;
    border: 1px solid var(--brand-border);
    border-radius: 0.5rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: border-color 0.15s ease, box-shadow 0.15s ease,
      transform 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .posts-title-list__item::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 3px;
    background: var(--brand-teal);
    transform: scaleY(0);
    transform-origin: center;
    transition: transform 0.15s ease;
  }

  .posts-title-list__item:hover {
    border-color: #99f6e4;
    box-shadow: 0 4px 14px rgba(15, 118, 110, 0.1);
    transform: translateY(-1px);
  }

  .posts-title-list__item:hover::before {
    transform: scaleY(1);
  }

  .posts-title-list__item a,
  .posts-title-list__item a:link,
  .posts-title-list__item a:visited,
  .posts-title-list__item a:active {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--brand-charcoal) !important;
    text-decoration: none !important;
    transition: color 0.15s ease;
  }

  .posts-title-list__item a:hover,
  .posts-title-list__item:hover a,
  .posts-title-list__item:hover a:visited {
    color: var(--brand-teal) !important;
  }

  .posts-title-list__date {
    flex: 0 0 auto;
    font-size: 0.8125rem;
    font-weight: 500;
    color: #94a3b8;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Posts: no author rail — wide centered reading column (~70vw).
     Scoped to wide single pages without .sidebar so Work/Research keep the profile rail. */
  body.layout--single.wide:not(:has(.sidebar)) #main {
    display: block;
  }

  body.layout--single.wide:not(:has(.sidebar)) .page,
  body.layout--single.wide:not(:has(.sidebar)) .page__related {
    float: none;
    width: 100%;
    max-width: min(52rem, 70vw);
    margin-left: auto;
    margin-right: auto;
    padding-right: 0;
  }

  body.layout--single.wide:not(:has(.sidebar)) .page__inner-wrap,
  body.layout--single.wide:not(:has(.sidebar)) .page__content {
    width: 100%;
  }

  @media (max-width: 768px) {
    body.layout--single.wide:not(:has(.sidebar)) .page,
    body.layout--single.wide:not(:has(.sidebar)) .page__related {
      max-width: 100%;
      padding-left: 0;
      padding-right: 0;
    }

    /* --- Mobile reading layout (phones / small tablets; desktop unchanged) --- */
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #main {
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .masthead__inner-wrap {
      padding-left: 0.85rem;
      padding-right: 0.85rem;
    }

    .greedy-nav a.site-title {
      font-size: 0.95rem;
      max-width: min(52vw, 12.5rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page__content,
    .archive {
      font-size: 1.0625rem;
      line-height: 1.7;
    }

    .page__title {
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .page__content h2,
    .archive h2 {
      font-size: 1.25rem;
    }

    .page__content h3,
    .archive h3 {
      font-size: 1.125rem;
    }

    .page__content h4,
    .archive h4 {
      font-size: 1.05rem;
    }

    .archive__subtitle {
      font-size: 1rem;
    }

    /* Author rail: MM defaults are ~10–12px; bump for touch reading */
    .sidebar p,
    .sidebar li {
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    .sidebar .author__name {
      font-size: 1.125rem;
      line-height: 1.3;
    }

    .author__bio {
      line-height: 1.45;
      margin-top: 0.35rem;
    }

    .author__avatar {
      width: 3.5rem;
      height: 3.5rem;
    }

    .author__avatar img {
      max-width: 3.5rem;
    }

    .author__content {
      padding-right: 0.75rem;
    }

    .author__urls-wrapper button {
      font-size: 0.875rem;
      min-height: 2.5rem;
      padding: 0.45rem 0.85rem;
    }

    .entries-list--compact .archive__item--compact,
    .entries-list--compact .archive__item {
      padding: 0.8rem 0.9rem !important;
    }

    .entries-list--compact .archive__item-title {
      font-size: 1rem;
      line-height: 1.4;
    }

    .archive__item-compact-row,
    .posts-title-list__item {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
    }

    .posts-title-list__item {
      padding: 0.8rem 0.9rem;
    }

    .posts-title-list__item a {
      font-size: 1rem;
    }

    /* Code: readable size, scroll inside the block */
    code {
      font-size: 0.875rem;
    }

    div.highlighter-rouge,
    figure.highlight,
    .page__content pre {
      font-size: 0.8125rem;
      line-height: 1.55;
      -webkit-overflow-scrolling: touch;
    }

    .page__footer {
      font-size: 0.875rem;
    }

    .page__footer-follow .social-icons a,
    .page__footer-follow li {
      font-size: 0.875rem;
    }

    .pagination li a {
      min-width: 2.75rem;
      height: 2.75rem;
      font-size: 0.9375rem;
    }
  }
</style>

<!-- end custom head snippets -->
